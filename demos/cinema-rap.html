<style>
:root{--surface:#111;--s2:#181818;--s3:#222}
body{font-family:'MoMoTrustSans','Be Vietnam Pro',sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* PAGE HEADER */
.page-header{border-bottom:1px solid var(--gray-200)}
.page-header-inner{max-width:var(--content);margin:0 auto;padding:20px 20px 16px}
.ph-title{font-size:24px;font-weight:800;letter-spacing:-.4px;margin-bottom:4px}
.ph-desc{font-size:13px;color:var(--gray-400);line-height:1.5}

/* CHAIN FILTER */
.chain-filter{border-bottom:1px solid var(--gray-200);background:#000;position:sticky;top:60px;z-index:100}
.chain-filter-inner{max-width:var(--content);margin:0 auto;padding:10px 20px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;align-items:center}
.chain-filter-inner::-webkit-scrollbar{display:none}

.chain-btn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 10px;border-radius:var(--r-lg);cursor:pointer;transition:all .15s;flex-shrink:0;min-width:56px}
.chain-btn:hover{background:var(--s2)}
.chain-btn.on{background:var(--s3)}
.chain-btn-logo{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:rgba(255,255,255,.06)}
.chain-btn-logo img{width:30px;height:30px;object-fit:contain;transition:filter .15s}
.chain-btn:not(.on) .chain-btn-logo img{filter:brightness(.55)}
.chain-btn.on .chain-btn-logo img{filter:brightness(1)}
.chain-btn-name{font-size:10px;font-weight:600;color:var(--gray-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56px;text-align:center}
.chain-btn.on .chain-btn-name{color:var(--pink-500)}

/* ALL BUTTON */
.chain-btn-all .chain-btn-logo{background:var(--pink-500)}
.chain-btn.on.chain-btn-all .chain-btn-logo{background:var(--pink-500)}
.chain-btn-all .chain-btn-name{color:var(--gray-500)}
.chain-btn.on.chain-btn-all .chain-btn-name{color:var(--pink-500)}

/* SPLIT LAYOUT */
.split-wrap{max-width:var(--content);margin:0 auto;display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 160px)}
@media(max-width:768px){.split-wrap{grid-template-columns:1fr}}

/* LEFT PANEL */
.left-panel{border-right:1px solid var(--gray-200);position:sticky;top:118px;height:calc(100vh - 118px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--gray-200) transparent}
.left-panel::-webkit-scrollbar{width:4px}
.left-panel::-webkit-scrollbar-thumb{background:var(--gray-200);border-radius:2px}

.search-wrap{padding:12px 16px;border-bottom:1px solid var(--gray-200);position:sticky;top:0;background:#000;z-index:10}
.search-box{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--gray-200);border-radius:var(--r-md);padding:8px 12px}
.search-box input{background:none;border:none;outline:none;color:var(--gray-900);font-size:13px;flex:1;font-family:inherit}
.search-box input::placeholder{color:var(--gray-400)}
.search-box svg{flex-shrink:0;color:var(--gray-400)}

.theater-list{}
.theater-item{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.04);transition:background .13s}
.theater-item:hover{background:var(--s2)}
.theater-item.on{background:rgba(235,47,150,.08);border-right:2px solid var(--pink-500)}
.ti-logo{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.ti-logo img{width:22px;height:22px;object-fit:contain;filter:brightness(.8)}
.theater-item.on .ti-logo img{filter:brightness(1)}
.ti-info{flex:1;min-width:0}
.ti-name{font-size:13px;font-weight:600;color:var(--gray-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.theater-item.on .ti-name{color:var(--gray-900)}
.ti-addr{font-size:11px;color:var(--gray-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ti-arrow{color:var(--gray-300);flex-shrink:0}
.theater-item.on .ti-arrow{color:var(--pink-400)}
.see-more-btn{display:block;width:100%;padding:14px;font-size:13px;font-weight:700;color:var(--pink-500);text-align:center;border-top:1px solid var(--gray-200);cursor:pointer;transition:background .13s}
.see-more-btn:hover{background:var(--s2)}

/* RIGHT PANEL */
.right-panel{padding:0}

.rp-header{padding:16px 20px;border-bottom:1px solid var(--gray-200);display:flex;align-items:flex-start;gap:12px}
.rp-chain-logo{width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.rp-chain-logo img{width:26px;height:26px;object-fit:contain}
.rp-header-info{flex:1}
.rp-name{font-size:16px;font-weight:800;color:var(--gray-900);margin-bottom:2px}
.rp-addr{font-size:12px;color:var(--gray-500);line-height:1.4}
.rp-map-link{font-size:12px;font-weight:600;color:var(--pink-500);flex-shrink:0;cursor:pointer}

/* DATE STRIP in right panel */
.rp-dates{padding:10px 20px;border-bottom:1px solid var(--gray-200);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.rp-dates::-webkit-scrollbar{display:none}
.rp-date{flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:8px 14px;border-radius:var(--r-md);border:1px solid var(--gray-200);background:var(--surface);font-size:12px;font-weight:700;color:var(--gray-500);cursor:pointer;transition:all .13s;min-width:52px}
.rp-date .rd-day{font-size:10px;font-weight:500;color:var(--gray-400);margin-bottom:2px}
.rp-date:hover{border-color:var(--gray-300);color:var(--gray-700)}
.rp-date.on{border-color:var(--pink-500);background:rgba(235,47,150,.08);color:var(--pink-500)}
.rp-date.on .rd-day{color:var(--pink-400)}

/* FILM LIST */
.film-list{padding:8px 0 40px}
.film-item{display:flex;gap:14px;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.05)}
.sched-poster{width:64px;height:96px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--s3)}
.sched-info{flex:1;min-width:0}
.sched-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.age-badge{font-size:10px;font-weight:800;padding:2px 6px;border-radius:4px;flex-shrink:0;margin-top:1px}
.age-P{background:#22c55e;color:#fff}
.age-T13{background:#f59e0b;color:#fff}
.age-T16{background:#f97316;color:#fff}
.age-C18{background:#ef4444;color:#fff}
.age-K{background:#8b5cf6;color:#fff}
.sched-title{font-size:15px;font-weight:800;color:var(--gray-900);line-height:1.3}
.sched-genre{font-size:12px;color:var(--gray-500);margin-bottom:10px}

.fmt-group{margin-bottom:10px}
.fmt-label{font-size:12px;font-weight:700;color:var(--gray-600);margin-bottom:6px}
.time-pills{display:flex;flex-wrap:wrap;gap:6px}
.time-pill{padding:5px 12px;border-radius:6px;border:1.5px solid rgba(235,47,150,.4);background:rgba(235,47,150,.05);font-size:12px;font-weight:700;color:var(--pink-500);cursor:pointer;transition:all .13s;white-space:nowrap}
.time-pill:hover{background:rgba(235,47,150,.12);border-color:var(--pink-500)}
.time-pill .tp-end{font-size:10px;font-weight:500;color:var(--pink-400);margin-left:4px}
.time-pill.few{border-color:rgba(251,146,60,.5);background:rgba(251,146,60,.06);color:#fb923c}
.time-pill.few .tp-end{color:#fdba74}

.rp-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;color:var(--gray-500)}
.rp-empty-icon{font-size:48px;margin-bottom:12px}
</style>

const PAGE_SIZE = 7;
let activeChain = 'all';
let activeTheater = null;
let activeDate = 0;
let searchQ = '';
let showCount = PAGE_SIZE;

function buildDates(){
  const today = new Date();
  return Array.from({length:7},(_,i)=>{
    const d = new Date(today); d.setDate(today.getDate()+i);
    return { day:i===0?'Hôm nay':VN_DAYS[d.getDay()], date:d.getDate(), month:d.getMonth()+1 };
  });
}

function filteredTheaters(){
  return THEATERS.filter(t=>{
    if(activeChain!=='all' && t.chain!==activeChain) return false;
    if(searchQ && !t.name.toLowerCase().includes(searchQ.toLowerCase()) && !t.addr.toLowerCase().includes(searchQ.toLowerCase())) return false;
    return true;
  });
}

  const allBtn = `<div class="chain-btn chain-btn-all ${activeChain==='all'?'on':''}" onclick="setChain('all')">
    <div class="chain-btn-logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    </div>
    <span class="chain-btn-name" style="${activeChain==='all'?'color:var(--pink-500)':''}">Tất cả</span>
  </div>`;
  const pills = CHAINS_META.map(c=>`
    <div class="chain-btn ${activeChain===c.slug?'on':''}" onclick="setChain('${c.slug}')">
      <div class="chain-btn-logo"><img src="${CHAIN_LOGOS[c.slug]}" alt="${c.name}" onerror="this.style.opacity='.3'"></div>
      <span class="chain-btn-name">${c.name}</span>
    </div>`).join('');
  document.getElementById('chainFilter').innerHTML = allBtn + pills;
}

function renderTheaterList(){
  const list = filteredTheaters();
  const visible = list.slice(0, showCount);
  const seeMore = document.getElementById('seeMoreBtn');
  seeMore.style.display = list.length > showCount ? 'block' : 'none';

  document.getElementById('theaterList').innerHTML = visible.map(t=>`
    <div class="theater-item ${activeTheater===t.slug?'on':''}" onclick="selectTheater('${t.slug}')">
      <div class="ti-logo"><img src="${CHAIN_LOGOS[t.chain]}" alt="" onerror="this.style.opacity='.2'"></div>
      <div class="ti-info">
        <div class="ti-name">${t.name}</div>
        <div class="ti-addr">${t.addr}</div>
      </div>
      <svg class="ti-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
    </div>`).join('');
}

function renderRightPanel(){
  const rp = document.getElementById('rightPanel');
  if(!activeTheater){
    rp.innerHTML=`<div class="rp-empty"><div class="rp-empty-icon">🎬</div><div>Chọn rạp để xem lịch chiếu</div></div>`;
    return;
  }
  const t = THEATERS.find(x=>x.slug===activeTheater);
  if(!t){ rp.innerHTML=''; return; }

  const dates = buildDates();
  const datePills = dates.map((d,i)=>`
    <div class="rp-date ${activeDate===i?'on':''}" onclick="setDate(${i})">
      <span class="rd-day">${d.day}</span>
      <span>${d.date}</span>
    </div>`).join('');

  const films = t.shows.map(sk=>{
    const s = SHOWS_SAMPLE[sk]; if(!s) return '';
    const img = FILM_IMG && FILM_IMG[s.title];
    const fmtRows = s.fmts.map(f=>`
      <div class="fmt-group">
        <div class="fmt-label">${f.label}</div>
        <div class="time-pills">${f.times.map(tt=>`
          <button class="time-pill ${tt.few?'few':''}" onclick="bookTicket('${t.slug}','${tt.t}')">
            ${tt.t}<span class="tp-end">~ ${tt.e}</span>
          </button>`).join('')}
        </div>
      </div>`).join('');
    return `<div class="film-item">
      ${img?`<img class="sched-poster" src="${img}" alt="${s.title}" onerror="this.style.background='var(--s3)'">`:`<div class="sched-poster"></div>`}
      <div class="sched-info">
        <div class="sched-top">
          <span class="age-badge age-${s.age}">${s.age}</span>
          <div class="sched-title">${s.title}</div>
        </div>
        <div class="sched-genre">${s.genre}</div>
        ${fmtRows}
      </div><!-- /sched-info -->
    </div>`;
  }).join('');

  rp.innerHTML = `
    <div class="rp-header">
      <div class="rp-chain-logo"><img src="${CHAIN_LOGOS[t.chain]}" alt=""></div>
      <div class="rp-header-info">
        <div class="rp-name">${t.name}</div>
        <div class="rp-addr">${t.addr}</div>
      </div>
      <div class="rp-map-link">[ Bản đồ ]</div>
    </div>
    <div class="rp-dates">${datePills}</div>
    <div class="film-list">${films}</div>`;
}

function setChain(slug){
  activeChain=slug; activeTheater=null; showCount=PAGE_SIZE;
  renderChainFilter(); renderTheaterList(); renderRightPanel();
}
function selectTheater(slug){
  activeTheater=slug; activeDate=0;
  renderTheaterList(); renderRightPanel();
}
function setDate(i){ activeDate=i; renderRightPanel(); }
function onSearch(q){ searchQ=q; showCount=PAGE_SIZE; renderTheaterList(); }
function seeMore(){ showCount+=PAGE_SIZE; renderTheaterList(); }
function bookTicket(slug,time){ window.location.href=`/cinema/rap/${slug}`; }

injectCinemaNav('rap');
renderChainFilter();
renderTheaterList();
renderRightPanel();
</script>
</body>
</html>
