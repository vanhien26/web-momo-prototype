<style>
:root{--surface:#111;--s2:#181818;--s3:#1f1f1f}
body{font-family:'MoMoTrustSans','Be Vietnam Pro',sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* PAGE HEADER */
.page-header{border-bottom:1px solid var(--gray-200)}
.page-header-inner{max-width:var(--content);margin:0 auto;padding:24px 20px 20px}
.ph-title{font-size:26px;font-weight:800;letter-spacing:-.4px;margin-bottom:6px}
.ph-desc{font-size:14px;color:var(--gray-400);line-height:1.6;max-width:500px}

/* DATE STRIP - sticky */
.date-strip{position:sticky;top:60px;z-index:100;background:#000;border-bottom:1px solid var(--gray-200)}
.date-strip-inner{max-width:var(--content);margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none}
.date-strip-inner::-webkit-scrollbar{display:none}
.date-pill{flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:6px 14px;border-radius:100px;border:1.5px solid var(--gray-200);background:var(--surface);font-size:12px;font-weight:600;color:var(--gray-500);cursor:pointer;transition:all .15s;line-height:1.3;white-space:nowrap}
.date-pill .dp-day{font-size:10px;font-weight:500;color:var(--gray-400)}
.date-pill:hover{border-color:var(--gray-300);color:var(--gray-700)}
.date-pill.on{border-color:var(--pink-500);background:rgba(235,47,150,.08);color:var(--pink-500)}
.date-pill.on .dp-day{color:var(--pink-400)}

/* MAIN */
.page-wrap{max-width:var(--content);margin:0 auto;padding:28px 20px 60px}

/* CHAIN PARTNER ROW */
.partner-section{margin-bottom:32px}
.partner-label{font-size:11px;font-weight:700;color:var(--gray-500);letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px}
.partner-row{display:flex;gap:0;flex-wrap:wrap}
.partner-logo-btn{display:flex;align-items:center;justify-content:center;padding:10px 14px;cursor:pointer;border-radius:var(--r-lg);transition:all .18s}
.partner-logo-btn:hover{background:var(--s2)}
.partner-logo-btn.on{background:var(--s2);box-shadow:0 0 0 1.5px var(--pink-400)}
.partner-logo-btn img{height:28px;object-fit:contain;display:block;filter:brightness(.6);transition:filter .18s}
.partner-logo-btn.on img,.partner-logo-btn:hover img{filter:brightness(1)}

/* CHAIN ACCORDION */
.chain-block{border:1px solid var(--gray-200);border-radius:var(--r-lg);overflow:hidden;margin-bottom:12px}
.chain-hdr{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;background:var(--s2);transition:background .15s;user-select:none}
.chain-hdr:hover{background:var(--s3)}
.chain-hdr-logo{height:28px;object-fit:contain}
.chain-hdr-info{flex:1}
.chain-hdr-name{font-size:14px;font-weight:700;color:var(--gray-900)}
.chain-hdr-sub{font-size:12px;color:var(--gray-500);margin-top:1px}
.chain-chevron{width:18px;height:18px;color:var(--gray-400);transition:transform .22s;flex-shrink:0}
.chain-hdr.open .chain-chevron{transform:rotate(180deg)}
.chain-body{display:none}
.chain-body.open{display:block}

/* THEATER ROW */
.theater-row{border-top:1px solid var(--gray-200)}
.theater-hdr{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;transition:background .15s}
.theater-hdr:hover{background:var(--s3)}
.theater-hdr-dot{width:8px;height:8px;border-radius:50%;background:var(--gray-300);flex-shrink:0}
.theater-hdr.open .theater-hdr-dot{background:var(--pink-500)}
.theater-hdr-name{flex:1;font-size:13px;font-weight:600;color:var(--gray-800)}
.theater-hdr-addr{font-size:11px;color:var(--gray-500);margin-top:1px}
.theater-hdr-formats{display:flex;gap:4px;flex-shrink:0}
.fmt-tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:3px;letter-spacing:.02em}
.fmt-tag.imax{background:#0a1a3a;color:#4a9eff;border:1px solid #1a3a6a}
.fmt-tag.d4x{background:#1a0a00;color:#ff8c42;border:1px solid #3a1a00}
.fmt-tag.gc{background:#0a1a0a;color:#4ade80;border:1px solid #1a3a1a}
.fmt-tag.d3,.fmt-tag.d2{background:rgba(255,255,255,.05);color:var(--gray-500);border:1px solid var(--gray-200)}
.theater-chevron{width:14px;height:14px;color:var(--gray-400);transition:transform .2s;flex-shrink:0}
.theater-hdr.open .theater-chevron{transform:rotate(180deg)}

/* SHOWTIMES PANEL */
.theater-shows{display:none;padding:0 16px 16px 34px;border-top:1px solid var(--gray-200);background:var(--surface)}
.theater-shows.open{display:block}
.show-film{margin-top:14px}
.show-film-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.show-film-poster{width:36px;height:54px;border-radius:4px;object-fit:cover;flex-shrink:0;background:var(--s3)}
.show-film-info{}
.show-film-title{font-size:13px;font-weight:700;color:var(--gray-900)}
.show-film-meta{font-size:11px;color:var(--gray-500);margin-top:2px}
.show-fmt-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.show-fmt-label{font-size:11px;font-weight:600;color:var(--gray-600);min-width:100px}
.time-pills{display:flex;gap:6px;flex-wrap:wrap}
.time-pill{padding:5px 12px;border-radius:6px;border:1px solid var(--gray-200);background:var(--s2);font-size:12px;font-weight:700;color:var(--gray-700);cursor:pointer;transition:all .13s}
.time-pill:hover{border-color:var(--pink-400);color:var(--pink-500);background:rgba(235,47,150,.06)}
.time-pill.few{border-color:rgba(251,146,60,.5);color:#fb923c}
.show-film-divider{height:1px;background:var(--gray-200);margin:12px 0 0}

let activeDate = 0;
let openChains = {};
let openTheaters = {};

function buildDates() {
  const today = new Date();
  return Array.from({length:7},(_,i)=>{
    const d = new Date(today); d.setDate(today.getDate()+i);
    return { day: i===0?'Hôm nay': VN_DAYS[d.getDay()], date: d.getDate(), month: d.getMonth()+1 };
  });
}

function fmtClass(f){
  if(f==='IMAX') return 'imax';
  if(f==='4DX') return 'd4x';
  if(f==='Goldclass') return 'gc';
  if(f==='3D') return 'd3';
  return 'd2';
}

function renderDateStrip(){
  const dates = buildDates();
  document.getElementById('dateStrip').innerHTML = dates.map((d,i)=>`
    <button class="date-pill ${activeDate===i?'on':''}" onclick="setDate(${i})">
      <span class="dp-day">${d.day}</span>
      <span>${d.date}/${d.month}</span>
    </button>`).join('');
}

function renderPartners(){
  document.getElementById('partnerRow').innerHTML = CHAINS.map(c=>`
    <button class="partner-logo-btn ${openChains[c.slug]?'on':''}" data-slug="${c.slug}" onclick="toggleChain('${c.slug}')" title="${c.name}">
      <img src="${c.logo}" alt="${c.name}" onerror="this.style.opacity='.3'">
    </button>`).join('');
}

function renderChains(){
  document.getElementById('chainList').innerHTML = CHAINS.map(c=>{
    const isOpen = !!openChains[c.slug];
    const theatersHtml = c.theaters.map(t=>{
      const tKey = c.slug+'_'+t.slug;
      const tOpen = !!openTheaters[tKey];
      const showsHtml = t.shows.map((s,si)=>`
        <div class="show-film">
          ${si>0?'<div class="show-film-divider"></div>':''}
          <div class="show-film-top" style="${si>0?'margin-top:12px':''}">
            ${(s.poster||(FILM_IMG&&FILM_IMG[s.title]))?`<img class="show-film-poster" src="${s.poster||(FILM_IMG&&FILM_IMG[s.title])}" alt="${s.title}" onerror="this.style.opacity='.2'">`:`<div class="show-film-poster"></div>`}
            <div class="show-film-info">
              <div class="show-film-title">${s.title}</div>
              <div class="show-film-meta">${s.age} · ${s.dur}</div>
            </div>
          </div>
          ${s.fmts.map(f=>`
            <div class="show-fmt-row">
              <span class="show-fmt-label"><span class="fmt-tag ${f.cls}">${f.label}</span></span>
              <div class="time-pills">${f.times.map(tt=>`
                <button class="time-pill ${tt.few?'few':''}" onclick="bookTicket('${t.slug}','${tt.t}')">${tt.t}</button>`).join('')}
              </div>
            </div>`).join('')}
        </div>`).join('');

      return `
        <div class="theater-row" id="theater-${tKey}">
          <div class="theater-hdr ${tOpen?'open':''}" onclick="toggleTheater('${tKey}')">
            <div class="theater-hdr-dot"></div>
            <div style="flex:1;min-width:0">
              <div class="theater-hdr-name">${t.name}</div>
              <div class="theater-hdr-addr">${t.addr}</div>
            </div>
            <div class="theater-hdr-formats">${t.formats.slice(0,3).map(f=>`<span class="fmt-tag ${fmtClass(f)}">${f}</span>`).join('')}</div>
            <svg class="theater-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
          </div>
          <div class="theater-shows ${tOpen?'open':''}">${showsHtml}</div>
        </div>`;
    }).join('');

    return `
      <div class="chain-block" id="chain-${c.slug}">
        <div class="chain-hdr ${isOpen?'open':''}" onclick="toggleChain('${c.slug}')">
          <img class="chain-hdr-logo" src="${c.logo}" alt="${c.name}" onerror="this.style.opacity='.3'">
          <div class="chain-hdr-info">
            <div class="chain-hdr-name">${c.name}</div>
          </div>
          <svg class="chain-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="chain-body ${isOpen?'open':''}">${theatersHtml}</div>
      </div>`;
  }).join('');
}

function render(){
  renderDateStrip();
  renderPartners();
  renderChains();
}

function setDate(i){ activeDate=i; renderDateStrip(); }

function toggleChain(slug){
  openChains[slug]=!openChains[slug];
  // update partner logo highlight
  document.querySelectorAll('.partner-logo-btn').forEach(b=>{
    b.classList.toggle('on', openChains[b.dataset.slug]);
  });
  // toggle chain body
  const block = document.getElementById('chain-'+slug);
  if(!block) return;
  const hdr = block.querySelector('.chain-hdr');
  const body = block.querySelector('.chain-body');
  hdr.classList.toggle('open', openChains[slug]);
  body.classList.toggle('open', openChains[slug]);
}

function toggleTheater(key){
  openTheaters[key]=!openTheaters[key];
  const el = document.getElementById('theater-'+key);
  if(!el) return;
  el.querySelector('.theater-hdr').classList.toggle('open', openTheaters[key]);
  el.querySelector('.theater-shows').classList.toggle('open', openTheaters[key]);
}

function bookTicket(theaterSlug, time){ window.location.href=`/cinema/rap/${theaterSlug}`; }

injectCinemaNav('rap');
render();
</script>
</body>
</html>
