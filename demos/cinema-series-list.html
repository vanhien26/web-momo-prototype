:root{
  --pink-500:#EB2F96;
  --bg:#000;
}
html{scroll-behavior:smooth}
body{font-family:'MoMoTrustSans',-apple-system,sans-serif;background:var(--bg);color:#fff;min-height:100vh}
img{max-width:100%;display:block}
button{cursor:pointer;font-family:inherit;border:none;background:none}
a{text-decoration:none;color:inherit}

/* HERO */
.sl-hero{position:relative;width:100%;height:clamp(300px,56vw,560px);overflow:hidden}
.sl-hero-bg{position:absolute;inset:-10%;background-size:cover;background-position:center top;filter:blur(20px) brightness(.45);transform:scale(1.25);will-change:transform}
.sl-hero-poster{position:absolute;right:0;top:0;bottom:0;width:55%;object-fit:cover;object-position:top center;-webkit-mask-image:linear-gradient(to left,rgba(0,0,0,.9) 0%,rgba(0,0,0,.5) 55%,transparent 100%);mask-image:linear-gradient(to left,rgba(0,0,0,.9) 0%,rgba(0,0,0,.5) 55%,transparent 100%)}
.sl-hero-grad{position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,.96) 0%,rgba(0,0,0,.75) 40%,rgba(0,0,0,.15) 75%,transparent 100%)}
.sl-hero-grad::after{content:'';position:absolute;bottom:0;left:0;right:0;height:120px;background:linear-gradient(to top,var(--bg),transparent)}
.sl-hero-content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(20px,4vw,56px) clamp(16px,4vw,56px) clamp(32px,4vw,52px);max-width:560px}
.sl-hero-eyebrow{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--pink-500);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sl-hero-title{font-size:clamp(22px,5.5vw,44px);font-weight:900;letter-spacing:-.5px;line-height:1.1;margin-bottom:10px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.sl-hero-meta{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:rgba(255,255,255,.65);margin-bottom:10px;flex-wrap:wrap}
.sl-hero-score{color:#FFD700;font-weight:800}
.sl-hero-dot{width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.35);flex-shrink:0}
.sl-hero-genres{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.sl-hero-genre{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.65);background:rgba(255,255,255,.07)}
.sl-hero-btns{display:flex;gap:10px;flex-wrap:wrap}
.sl-btn-primary{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:700;padding:11px 22px;border-radius:10px;background:var(--pink-500);color:#fff;cursor:pointer;border:none;font-family:inherit;transition:background .15s}
.sl-btn-primary:hover{background:#c9166c}
.sl-btn-outline{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;padding:11px 20px;border-radius:10px;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;border:1.5px solid rgba(255,255,255,.28);font-family:inherit;transition:background .15s;backdrop-filter:blur(6px)}
.sl-btn-outline:hover{background:rgba(255,255,255,.18)}

/* FILTER BAR */
.sl-filter-section{background:#000;position:sticky;top:60px;z-index:50;border-bottom:1px solid rgba(255,255,255,.07)}
.sl-filter-inner{max-width:1240px;margin:0 auto;padding:0 clamp(12px,3vw,24px)}
.sl-filter-row{display:flex;align-items:center;gap:5px;padding:10px 0;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.sl-filter-row::-webkit-scrollbar{display:none}
.sl-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:5px 13px;border-radius:20px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:rgba(255,255,255,.55);cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0}
.sl-chip:hover{border-color:rgba(255,255,255,.32);color:rgba(255,255,255,.9);background:rgba(255,255,255,.09)}
.sl-chip.on{background:var(--pink-500);border-color:var(--pink-500);color:#fff}
.sl-chip-divider{width:1px;height:16px;background:rgba(255,255,255,.1);flex-shrink:0;margin:0 3px;align-self:center}
.sl-sort-row{max-width:1240px;margin:0 auto;padding:12px clamp(12px,3vw,24px) 6px;display:flex;align-items:center;gap:8px}
.sl-count{font-size:12px;color:rgba(255,255,255,.35);font-weight:600}
.sl-sort-chips{display:flex;gap:4px;margin-left:auto}
.sort-chip{font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.12);background:transparent;color:rgba(255,255,255,.4);cursor:pointer;transition:all .15s;white-space:nowrap}
.sort-chip:hover{border-color:rgba(255,255,255,.3);color:rgba(255,255,255,.8)}
.sort-chip.on{background:#fff;color:#000;border-color:#fff}

/* ROW SECTIONS */
.sl-main{max-width:1240px;margin:0 auto;padding:16px 0 80px}
.sl-row-section{margin-bottom:38px}
.sl-row-hd{display:flex;align-items:baseline;gap:10px;padding:0 clamp(12px,3vw,24px) 12px}
.sl-row-title{font-size:clamp(14px,2.2vw,18px);font-weight:800;color:#fff;letter-spacing:-.2px}
.sl-row-more{font-size:12px;font-weight:600;color:var(--pink-500);cursor:pointer;margin-left:auto;opacity:0;transition:opacity .2s;white-space:nowrap}
.sl-row-section:hover .sl-row-more{opacity:1}
.sl-scroll{display:flex;gap:8px;overflow-x:auto;padding:0 clamp(12px,3vw,24px) 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sl-scroll::-webkit-scrollbar{display:none}

/* ROW CARD */
.slc{flex-shrink:0;width:clamp(128px,38vw,158px);border-radius:8px;overflow:hidden;cursor:pointer;position:relative;aspect-ratio:2/3;transition:transform .25s,box-shadow .25s}
@media(min-width:600px){.slc{width:clamp(140px,15vw,180px)}}
@media(min-width:1024px){
  .slc:hover{transform:scale(1.07);box-shadow:0 14px 40px rgba(0,0,0,.85);z-index:2}
  .slc:hover .slc-poster img{filter:brightness(1.08)}
}
.slc-poster{position:absolute;inset:0;background:#1a1a1a}
.slc-poster img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .3s}
.slc-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.88) 0%,rgba(0,0,0,.1) 52%,transparent 75%);pointer-events:none}
.slc-body{position:absolute;bottom:0;left:0;right:0;padding:8px 9px 10px;z-index:2}
.slc-title{font-size:12px;font-weight:700;color:#fff;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:3px}
.slc-meta{display:flex;align-items:center;gap:4px;font-size:10px;color:rgba(255,255,255,.5)}
.slc-score{color:rgba(255,215,0,.85);font-weight:700}
.slc-badge{position:absolute;top:7px;left:7px;z-index:3;font-size:9px;font-weight:800;padding:2px 7px;border-radius:20px;letter-spacing:.1px}
.slc-badge.airing{background:rgba(34,197,94,.9);color:#fff}
.slc-badge.ended{background:rgba(0,0,0,.55);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.15)}
.slc-badge.upcoming{background:rgba(245,197,24,.95);color:#000}

/* GRID VIEW (when filter active) */
.sl-grid-wrap{padding:0 clamp(12px,3vw,24px) 60px}
.sl-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:480px){.sl-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:768px){.sl-grid{grid-template-columns:repeat(4,1fr);gap:14px}}
@media(min-width:1100px){.sl-grid{grid-template-columns:repeat(5,1fr)}}
.sgc{border-radius:9px;overflow:hidden;cursor:pointer;position:relative;aspect-ratio:2/3;transition:transform .25s}
.sgc:hover{transform:translateY(-3px)}
.sgc-poster{position:absolute;inset:0;background:#1a1a1a}
.sgc-poster img{width:100%;height:100%;object-fit:cover;display:block}
.sgc-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.88) 0%,transparent 60%);pointer-events:none}
.sgc-body{position:absolute;bottom:0;left:0;right:0;padding:9px 10px 11px;z-index:2}
.sgc-title{font-size:12px;font-weight:700;color:#fff;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:3px}

.sl-empty h3{font-size:16px;font-weight:700;margin-bottom:6px;color:rgba(255,255,255,.5)}
.sl-empty p{font-size:13px}
</style>

const ALL_GENRES = [...new Set(SERIES.flatMap(s => s.genres))].sort();
const ALL_PLATFORMS = [
  { id: 'fptplay', label: 'FPT Play', color: '#E5001C' },
  { id: 'netflix', label: 'Netflix',  color: '#141414' },
  { id: 'vieon',   label: 'VieON',    color: '#0065BD' },
];
const SORT_OPTIONS = [
  { id: 'score',  label: 'Điểm cao nhất' },
  { id: 'newest', label: 'Mới nhất' },
  { id: 'az',     label: 'A–Z' },
];

const state = { genres: [], platforms: [], sort: 'score', query: '' };

function hasFilter() {
  return state.genres.length || state.platforms.length || state.query;
}
function toggleFilter(key, val) {
  const arr = state[key];
  const i = arr.indexOf(val);
  if (i === -1) arr.push(val); else arr.splice(i, 1);
  renderChips();
  renderContent();
}
function setSort(val) {
  state.sort = val;
  renderChips();
  renderContent();
}

function renderChips() {
  document.getElementById('genre-chips').innerHTML = ALL_GENRES.map(g =>
    `<button class="sl-chip ${state.genres.includes(g)?'on':''}" onclick="toggleFilter('genres','${g.replace(/'/g,"\\'")}')">${g}</button>`
  ).join('');
  document.getElementById('platform-chips').innerHTML = ALL_PLATFORMS.map(p =>
    `<button class="sl-chip ${state.platforms.includes(p.id)?'on':''}" onclick="toggleFilter('platforms','${p.id}')"><span style="width:8px;height:8px;border-radius:2px;background:${p.color};display:inline-block;flex-shrink:0"></span>${p.label}</button>`
  ).join('');
  document.getElementById('sort-chips').innerHTML = SORT_OPTIONS.map(s =>
    `<button class="sort-chip ${state.sort===s.id?'on':''}" onclick="setSort('${s.id}')">${s.label}</button>`
  ).join('');
}

function filterData() {
  let data = [...SERIES];
  if (state.genres.length)    data = data.filter(s => state.genres.some(g => s.genres.includes(g)));
  if (state.platforms.length) data = data.filter(s => s.platforms.some(p => state.platforms.includes(p.id)));
  if (state.query)            data = data.filter(s => s.title.toLowerCase().includes(state.query) || s.orig.toLowerCase().includes(state.query));
  if (state.sort === 'score')  data.sort((a,b) => b.score - a.score);
  if (state.sort === 'newest') data.sort((a,b) => b.year - a.year);
  if (state.sort === 'az')     data.sort((a,b) => a.title.localeCompare(b.title));
  return data;
}

function rowCardHtml(s) {
  return `<div class="slc" onclick="goSeries(${s.id},'${s.slug}')">
    <div class="slc-poster"><img src="${s.poster}" alt="${s.title}" loading="lazy"></div>
    <div class="slc-overlay"></div>
    <div class="slc-body">
      <div class="slc-title">${s.title}</div>
      <div class="slc-meta">
        <span>${s.year}</span>
        <span style="width:2px;height:2px;border-radius:50%;background:rgba(255,255,255,.3);display:inline-block"></span>
        <span>${s.seasons} mùa</span>
        <span style="width:2px;height:2px;border-radius:50%;background:rgba(255,255,255,.3);display:inline-block"></span>
        <span class="slc-score">★${s.score.toFixed(1)}</span>
      </div>
    </div>
  </div>`;
}

function gridCardHtml(s) {
  return `<div class="sgc" onclick="goSeries(${s.id},'${s.slug}')">
    <div class="sgc-poster"><img src="${s.poster}" alt="${s.title}" loading="lazy"></div>
    <div class="sgc-overlay"></div>
    <div class="sgc-body">
      <div class="sgc-title">${s.title}</div>
      <div class="sgc-meta">
        <span>${s.year}</span>
        <span style="width:2px;height:2px;border-radius:50%;background:rgba(255,255,255,.3);display:inline-block"></span>
        <span>${s.seasons} mùa</span>
        <span style="width:2px;height:2px;border-radius:50%;background:rgba(255,255,255,.3);display:inline-block"></span>
        <span class="sgc-score">★${s.score.toFixed(1)}</span>
      </div>
    </div>
  </div>`;
}

function renderRow(icon, label, items) {
  if (!items.length) return '';
  return `<div class="sl-row-section">
    <div class="sl-row-hd">
      <i data-lucide="${icon}" width="16" height="16" stroke-width="2" style="color:var(--pink-500);flex-shrink:0"></i>
      <span class="sl-row-title">${label}</span>
      <span class="sl-row-more">Xem thêm →</span>
    </div>
    <div class="sl-scroll">${items.map(rowCardHtml).join('')}</div>
  </div>`;
}

const ROWS_DEF = [
  { icon: 'star',      label: 'Điểm cao nhất',         fn: s => true, sort: (a,b) => b.score - a.score },
  { icon: 'tv-2',      label: 'Phim Hàn',              fn: s => /[가-힣]/.test(s.orig) || ['tvN','MBC','ENA','JTBC'].includes(s.network) },
  { icon: 'zap',       label: 'Anime',                 fn: s => s.genres.includes('Hoạt hình') },
  { icon: 'search',    label: 'Tội phạm & Hồi hộp',   fn: s => s.genres.some(g => ['Tội phạm','Hồi hộp','Bí ẩn'].includes(g)) },
  { icon: 'swords',    label: 'Hành động & Phiêu lưu', fn: s => s.genres.some(g => ['Hành động','Phiêu lưu'].includes(g)) },
  { icon: 'telescope', label: 'Giả tưởng & Sci-Fi',   fn: s => s.genres.some(g => ['Giả tưởng','Khoa học viễn tưởng'].includes(g)) },
  { icon: 'heart',     label: 'Tình cảm & Hài kịch',  fn: s => s.genres.some(g => ['Tình cảm','Hài kịch'].includes(g)) },
  { icon: 'calendar',  label: 'Mới nhất',              fn: s => true, sort: (a,b) => b.year - a.year },
];

function renderRows() {
  document.getElementById('slRows').innerHTML = ROWS_DEF.map(rc => {
    let items = SERIES.filter(rc.fn);
    if (rc.sort) items = [...items].sort(rc.sort);
    return renderRow(rc.icon, rc.label, items);
  }).join('');
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

function renderGridView() {
  const data = filterData();
  document.getElementById('result-count').textContent = `${data.length} series`;
  const el = document.getElementById('slGrid');
  if (!data.length) {
    el.innerHTML = '<div class="sl-empty"><h3>Không tìm thấy kết quả</h3><p>Thử thay đổi bộ lọc hoặc từ khóa</p></div>';
    return;
  }
  el.innerHTML = `<div class="sl-grid-wrap"><div class="sl-grid">${data.map(gridCardHtml).join('')}</div></div>`;
}

function renderContent() {
  const rows = document.getElementById('slRows');
  const grid = document.getElementById('slGrid');
  const cnt  = document.getElementById('result-count');
  if (hasFilter()) {
    rows.style.display = 'none';
    grid.style.display = '';
    renderGridView();
  } else {
    rows.style.display = '';
    grid.style.display = 'none';
    cnt.textContent = `${SERIES.length} series`;
    renderRows();
  }
}

function renderHero() {
  const featured = [...SERIES].sort((a,b) => b.score - a.score)[0];
  const bigPoster = featured.poster.replace('/w342/', '/w780/');
  document.getElementById('sl-hero').innerHTML = `
    <div class="sl-hero">
      <div class="sl-hero-bg" style="background-image:url(${bigPoster})"></div>
      <img class="sl-hero-poster" src="${bigPoster}" alt="${featured.title}" loading="eager">
      <div class="sl-hero-grad"></div>
      <div class="sl-hero-content">
        <div class="sl-hero-eyebrow">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><rect width="20" height="15" x="2" y="7" rx="2"/><polyline points="17 2 12 7 7 2"/></svg>
          Series nổi bật
        </div>
        <div class="sl-hero-title">${featured.title}</div>
        <div class="sl-hero-meta">
          <span class="sl-hero-score">★ ${featured.score.toFixed(1)}</span>
          <span class="sl-hero-dot"></span>
          <span>${featured.year}</span>
          <span class="sl-hero-dot"></span>
          <span>${featured.seasons} mùa</span>
          <span class="sl-hero-dot"></span>
          <span>${featured.network}</span>
        </div>
        <div class="sl-hero-genres">
          ${featured.genres.map(g=>`<span class="sl-hero-genre">${g}</span>`).join('')}
        </div>
        <div class="sl-hero-btns">
          <button class="sl-btn-primary" onclick="goSeries(${featured.id},'${featured.slug}')">
            <svg width="13" height="13" fill="currentColor" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            Xem ngay
          </button>
          <button class="sl-btn-outline" onclick="goSeries(${featured.id},'${featured.slug}')">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
            Thêm thông tin
          </button>
        </div>
      </div>
    </div>`;
}

function goSeries(id, slug) {
  window.location.href = `/cinema/series/${slug}-${id}`;
}

renderHero();
renderChips();
renderContent();
</script>
