<style>

:root{
  --pink-500:#EB2F96;--pink-50:rgba(235,47,150,.15);--pink-200:#FFADD2;
  --gray-900:#FFFFFF;--gray-700:#E0E0E0;--gray-500:#9E9E9E;
  --gray-400:#757575;--gray-300:#424242;--gray-200:#2A2A2A;
  --gray-100:#1E1E1E;--white:#000;--bg:#000000;
  --r-sm:8px;--r-md:12px;--r-lg:16px;
  --shadow-s:0 1px 3px rgba(0,0,0,.8);
  --shadow-m:0 4px 12px rgba(0,0,0,.9);
  --content:1100px;
}
html{scroll-behavior:smooth}
body{font-family:'MoMoTrustSans',-apple-system,sans-serif;background:var(--bg);color:var(--gray-900);min-height:100vh;font-size:15px;line-height:1.5}
img{max-width:100%;display:block}
button{cursor:pointer;font-family:inherit;border:none;background:none}
a{text-decoration:none;color:inherit}

/* PAGE HEADER */
.page-hd{background:#000;position:sticky;top:60px;z-index:100}
.page-hd-inner{max-width:var(--content);margin:0 auto;padding:0 20px}

/* Row 1: title + count + sort */
.page-hd-top{display:flex;align-items:center;gap:12px;padding:14px 0 10px}
.page-hd-title{font-size:18px;font-weight:800;letter-spacing:-.3px;color:var(--gray-900);display:flex;align-items:center;gap:7px}
.page-hd-count{font-size:13px;font-weight:500;color:var(--gray-400)}
.sort-chips{display:flex;gap:4px;margin-left:auto}
.sort-chip{font-size:12px;font-weight:600;padding:4px 11px;border-radius:20px;border:1px solid var(--gray-200);background:#000;color:var(--gray-500);cursor:pointer;transition:all .15s;white-space:nowrap}
.sort-chip:hover{border-color:var(--gray-300);color:var(--gray-700)}
.sort-chip.on{background:#fff;color:#000;border-color:#fff}

/* Row 2: genre chips */
.filter-bar{display:flex;gap:5px;padding:10px 0;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.filter-bar::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:5px 13px;border-radius:20px;border:1px solid var(--gray-200);background:#000;color:var(--gray-500);cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0}
.chip:hover{border-color:var(--gray-300);color:var(--gray-700)}
.chip.on{background:var(--pink-500);border-color:var(--pink-500);color:#fff}
.filter-divider{width:1px;height:16px;background:var(--gray-200);flex-shrink:0;margin:0 2px;align-self:center}

/* GRID */
.page-body{max-width:var(--content);margin:0 auto;padding:20px 20px 60px}
.series-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(min-width:500px){.series-grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:768px){.series-grid{grid-template-columns:repeat(5,1fr);gap:14px}}
@media(min-width:1100px){.series-grid{grid-template-columns:repeat(6,1fr)}}

/* SERIES CARD */
.sc{border-radius:10px;overflow:hidden;cursor:pointer;position:relative;aspect-ratio:2/3;transition:transform .25s;flex-shrink:0}
.sc:hover{transform:translateY(-4px)}
.sc:hover .sc-poster img{transform:scale(1.05)}
.sc-poster{position:absolute;inset:0;background:var(--gray-200)}
.sc-poster img{width:100%;height:100%;object-fit:cover;transition:transform .35s;display:block}
.sc-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.88) 0%,rgba(0,0,0,.2) 45%,transparent 70%);pointer-events:none}
.sc-body{position:absolute;bottom:0;left:0;right:0;padding:10px 10px 12px;z-index:2}
.sc-title{font-size:13px;font-weight:700;color:#fff;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px}
.sc-meta{display:flex;align-items:center;gap:5px;font-size:10px;color:rgba(255,255,255,.55)}
.sc-dot{width:2px;height:2px;border-radius:50%;background:rgba(255,255,255,.4)}
.sc-score{color:rgba(255,255,255,.75);font-weight:700;display:flex;align-items:center;gap:2px}
.sc-status{position:absolute;top:8px;left:8px;z-index:3;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.1px;backdrop-filter:blur(6px)}
.sc-status.airing{background:rgba(34,197,94,.85);color:#fff}
.sc-status.ended{background:rgba(0,0,0,.5);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.15)}
.sc-status.upcoming{background:rgba(245,197,24,.9);color:#000}

/* EMPTY STATE */
.empty{text-align:center;padding:80px 20px;color:var(--gray-400)}
.empty-icon{margin:0 auto 16px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:var(--gray-100);border-radius:50%}
.empty h3{font-size:16px;font-weight:700;color:var(--gray-600);margin-bottom:6px}
.empty p{font-size:14px}



.bc-bar{border-bottom:1px solid rgba(255,255,255,.08);padding:0 20px}
.bc-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:6px;height:36px}
.bc-lnk{font-size:12px;font-weight:600;color:rgba(255,255,255,.45);text-decoration:none;cursor:pointer;background:none;border:none;padding:0;font-family:inherit;transition:color .15s}
.bc-lnk:hover{color:rgba(255,255,255,.8)}
.bc-sep{font-size:12px;color:rgba(255,255,255,.25)}
.bc-cur{font-size:12px;font-weight:600;color:rgba(255,255,255,.8)}
</style>
</head>

    platforms: [{ id:'netflix', label:'N', color:'#141414', tc:'#E50914' }],
    network: 'Netflix',
  },
  {
    id: 91239, slug: 'vinland-saga',
    title: 'Vinland Saga', orig: 'ヴィンランド・サガ',
    poster: 'https://image.tmdb.org/t/p/w342/vUHlpA5c1NXkds59reY3HMb4Abs.jpg',
    year: 2019, seasons: 2, status: 'ended',
    score: 8.9, genres: ['Hành động','Hoạt hình','Lịch sử'],
    platforms: [{ id:'netflix', label:'N', color:'#141414', tc:'#E50914' }],
    network: 'NHK',
  },
];

const ALL_GENRES = [...new Set(SERIES.flatMap(s => s.genres))].sort();
const ALL_PLATFORMS = [
  { id: 'fptplay', label: 'FPT Play', color: '#E5001C', tc: '#fff', lbl: 'FPT' },
  { id: 'netflix', label: 'Netflix',  color: '#141414', tc: '#E50914', lbl: 'N' },
  { id: 'vieon',   label: 'VieON',    color: '#0065BD', tc: '#fff', lbl: 'Vie' },
];
const STATUS_OPTIONS = [
  { id: 'airing',   label: 'Đang chiếu' },
  { id: 'upcoming', label: 'Sắp ra mắt' },
  { id: 'ended',    label: 'Đã kết thúc' },
];
const SORT_OPTIONS = [
  { id: 'score',  label: 'Điểm cao nhất' },
  { id: 'newest', label: 'Mới nhất' },
  { id: 'az',     label: 'A–Z' },
];

const state = {
  genres: [],
  platforms: [],
  statuses: [],
  sort: 'score',
  query: '',
};

function toggleFilter(key, val) {
  const arr = state[key];
  const idx = arr.indexOf(val);
  if (idx === -1) arr.push(val); else arr.splice(idx, 1);
  renderChips();
  renderGrid();
}
function setSort(val) {
  state.sort = val;
  renderChips();
  renderGrid();
}
function onSearch(v) {
  state.query = v.toLowerCase().trim();
  renderGrid();
}

function renderChips() {
  document.getElementById('genre-chips').innerHTML = ALL_GENRES.map(g => `
    <button class="chip ${state.genres.includes(g) ? 'on' : ''}" onclick="toggleFilter('genres','${g}')">${g}</button>
  `).join('');

  document.getElementById('platform-chips').innerHTML = ALL_PLATFORMS.map(p => `
    <button class="chip ${state.platforms.includes(p.id) ? 'on' : ''}" onclick="toggleFilter('platforms','${p.id}')">
      <span style="width:10px;height:10px;border-radius:3px;background:${p.color};flex-shrink:0;display:inline-block"></span>
      ${p.label}
    </button>
  `).join('');

  document.getElementById('status-chips').innerHTML = STATUS_OPTIONS.map(s => `
    <button class="chip ${state.statuses.includes(s.id) ? 'on' : ''}" onclick="toggleFilter('statuses','${s.id}')">${s.label}</button>
  `).join('');

  document.getElementById('sort-chips').innerHTML = SORT_OPTIONS.map(s => `
    <button class="sort-chip ${state.sort === s.id ? 'on' : ''}" onclick="setSort('${s.id}')">${s.label}</button>
  `).join('');
}

function filterData() {
  let data = [...SERIES];
  if (state.genres.length)    data = data.filter(s => state.genres.some(g => s.genres.includes(g)));
  if (state.platforms.length) data = data.filter(s => s.platforms.some(p => state.platforms.includes(p.id)));
  if (state.statuses.length)  data = data.filter(s => state.statuses.includes(s.status));
  if (state.query)            data = data.filter(s => s.title.toLowerCase().includes(state.query) || s.orig.toLowerCase().includes(state.query));
  if (state.sort === 'score')  data.sort((a,b) => b.score - a.score);
  if (state.sort === 'newest') data.sort((a,b) => b.year - a.year);
  if (state.sort === 'az')     data.sort((a,b) => a.title.localeCompare(b.title));
  return data;
}

const STATUS_LABEL = { airing: 'Đang chiếu', ended: 'Đã kết thúc', upcoming: 'Sắp ra mắt' };

function renderGrid() {
  const data = filterData();
  document.getElementById('result-count').textContent = `${data.length} series`;

  if (!data.length) {
    document.getElementById('series-grid').innerHTML = `
      <div class="empty" style="grid-column:1/-1">
        <div class="empty-icon"><i data-lucide="search-x" width="22" height="22" stroke-width="1.75"></i></div>
        <h3>Không tìm thấy kết quả</h3>
        <p>Thử thay đổi bộ lọc hoặc từ khóa tìm kiếm</p>
      </div>`;
    if (typeof lucide !== 'undefined') lucide.createIcons();
    return;
  }

  document.getElementById('series-grid').innerHTML = data.map(s => `
    <div class="sc" onclick="goSeries(${s.id},'${s.slug}')">
      <div class="sc-poster">
        <img src="${s.poster}" alt="${s.title}" loading="lazy">
      </div>
      <div class="sc-overlay"></div>
      <span class="sc-status ${s.status}">${STATUS_LABEL[s.status]}</span>
      <div class="sc-body">
        <div class="sc-title">${s.title}</div>
        <div class="sc-meta">
          <span>${s.year}</span>
          <span class="sc-dot"></span>
          <span>${s.seasons} mùa</span>
          <span class="sc-dot"></span>
          <span class="sc-score">★ ${s.score.toFixed(1)}</span>
        </div>
      </div>
    </div>
  `).join('');
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

function goSeries(id, slug) {
  window.location.href = `/cinema/series/${slug}-${id}`;
}

renderChips();
renderGrid();
if (typeof lucide !== 'undefined') lucide.createIcons();
</script>
<div id="toastEl" class="toast"></div>
</body>
</html>
