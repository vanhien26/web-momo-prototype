<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Thể loại phim - MoMo Cinema</title>
<meta name="description" content="Khám phá tất cả thể loại phim đang chiếu trên MoMo Cinema - Hành động, Kinh dị, Hoạt hình, Tình cảm và nhiều hơn nữa.">
<link rel="stylesheet" href="/assets/cinema-shared.css">
<script src="/assets/lucide.min.js"></script>
<style>
/* PAGE-SPECIFIC */
/* BREADCRUMB */
.breadcrumb-bar{background:#111111;border-bottom:1px solid var(--gray-200);padding:0 20px}
.breadcrumb-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:6px;height:37px;font-size:12px}
.bc-item{color:var(--gray-500);text-decoration:none;cursor:pointer;transition:.15s}
.bc-item:hover{color:var(--pink-500)}
.bc-sep{color:var(--gray-300)}
.bc-current{color:var(--gray-900);font-weight:700}

/* PAGE HEADER */
.page-header{background:#111111;border-bottom:1px solid var(--gray-200);padding:28px 20px 24px}
.page-header-inner{max-width:1100px;margin:0 auto}
.page-title{font-size:28px;font-weight:900;color:var(--gray-900);margin-bottom:6px}
.page-sub{font-size:14px;color:var(--gray-500);margin-bottom:20px}

/* CONTROLS */
.controls{max-width:1100px;margin:0 auto;padding:20px 20px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ctrl-label{font-size:12px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.05em}
.sort-pills{display:flex;gap:6px}
.spill{font-family:inherit;font-size:12px;font-weight:700;padding:5px 14px;border-radius:20px;border:1.5px solid var(--gray-200);background:#111111;color:var(--gray-500);cursor:pointer;transition:.15s}
.spill.on{background:var(--gray-900);color:#000;border-color:var(--gray-900)}
.spill:hover:not(.on){background:var(--gray-100)}
.ctrl-count{margin-left:auto;font-size:12px;color:var(--gray-400);font-weight:600}

/* GENRE GRID */
.genre-section{max-width:1100px;margin:0 auto;padding:20px}
.genre-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:1000px){.genre-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:680px){.genre-grid{grid-template-columns:repeat(2,1fr)}}

/* GENRE CARD */
.genre-card{border-radius:24px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;position:relative;background:#111111;box-shadow:var(--shadow-s)}
.genre-card:hover{box-shadow:var(--shadow-l);transform:translateY(-4px)}
.gc-poster-strip{position:relative;height:160px;overflow:hidden;background:var(--gc-dark,#111)}
.gc-poster-strip img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.genre-card:hover .gc-poster-strip img{transform:scale(1.06)}
.gc-fade{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 25%,var(--gc-dark,#111) 100%)}
.gc-hot-badge{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:4px;font-size:10px;font-weight:800;background:var(--pink-500);color:#fff;padding:3px 9px 3px 7px;border-radius:20px;z-index:2}
.gc-body{padding:12px 14px 14px;background:#111111}
.gc-name{font-size:15px;font-weight:900;color:var(--gray-900);line-height:1.2;margin-bottom:3px}
.gc-count{font-size:12px;color:var(--gray-400);font-weight:600}

/* FEATURED ROW */
.featured-section{max-width:1100px;margin:0 auto;padding:28px 20px 4px}
.sec-hd-title{font-size:18px;font-weight:900;color:var(--gray-900)}
.sec-hd-sub{font-size:12px;color:var(--gray-400)}
.featured-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:680px){.featured-row{grid-template-columns:1fr 1fr}}

.feat-card{border-radius:24px;overflow:hidden;position:relative;cursor:pointer;transition:.25s;min-height:180px;box-shadow:var(--shadow-m)}
.feat-card:hover{box-shadow:var(--shadow-l);transform:translateY(-3px)}
.feat-bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .4s}
.feat-card:hover .feat-bg{transform:scale(1.04)}
.feat-overlay{position:absolute;inset:0;background:linear-gradient(160deg,rgba(0,0,0,.1) 0%,rgba(0,0,0,.75) 100%)}
.feat-color-tint{position:absolute;inset:0;opacity:.35}
.feat-body{position:relative;z-index:2;padding:18px;height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.feat-name{font-size:18px;font-weight:900;color:#fff;margin-bottom:4px;line-height:1.2}
.feat-count{font-size:12px;color:rgba(255,255,255,.8);margin-bottom:10px}
.feat-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.feat-tag{font-size:10px;font-weight:700;color:rgba(255,255,255,.9);background:rgba(255,255,255,.18);border-radius:20px;padding:2px 9px;backdrop-filter:blur(4px)}
.feat-cta{font-family:inherit;font-size:12px;font-weight:800;color:#fff;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.4);border-radius:var(--r-xl);padding:6px 16px;cursor:pointer;backdrop-filter:blur(4px);transition:.15s}
.feat-cta:hover{background:rgba(255,255,255,.35)}

/* ALL GENRES heading */
.all-genres-hd{max-width:1100px;margin:0 auto;padding:24px 20px 0;display:flex;align-items:center;justify-content:space-between}
.all-genres-hd h2{font-size:18px;font-weight:900;color:var(--gray-900)}

/* FOOTER */
.footer{color:var(--gray-400);font-size:12px;padding:20px;text-align:center;margin-top:48px;border-top:1px solid var(--gray-200)}
@media(max-width:768px){.breadcrumb-bar{display:none}}
</style>
</head>
<body>

<div class="breadcrumb-bar">
  <div class="breadcrumb-inner">
    <a class="bc-item" href="/cinema">Cinema</a>
    <span class="bc-sep">›</span>
    <span class="bc-current">Thể loại</span>
  </div>
</div>

<div class="page-header">
  <div class="page-header-inner">
    <h1 class="page-title">Khám phá theo thể loại</h1>
    <p class="page-sub">Tìm phim bạn yêu thích theo thể loại — từ hành động mãn nhãn đến kinh dị rùng mình</p>
  </div>
</div>

<div class="featured-section">
  <div class="sec-hd">
    <div class="sec-hd-title">🔥 Thể loại đang hot</div>
    <div class="sec-hd-sub">Nhiều phim đang chiếu nhất</div>
  </div>
  <div class="featured-row" id="featuredRow"></div>
</div>

<div class="all-genres-hd">
  <h2>Tất cả thể loại</h2>
</div>
<div class="controls">
  <span class="ctrl-label">Sắp xếp</span>
  <div class="sort-pills">
    <button class="spill on" onclick="setSort('hot',this)">🔥 Phổ biến nhất</button>
    <button class="spill" onclick="setSort('az',this)">A - Z</button>
    <button class="spill" onclick="setSort('count',this)">Nhiều phim nhất</button>
  </div>
  <span class="ctrl-count" id="ctrlCount"></span>
</div>
<div class="genre-section">
  <div class="genre-grid" id="genreGrid"></div>
</div>

<div class="footer">MoMo Cinema — Dữ liệu lịch chiếu là prototype demo.</div>
<div class="toast" id="toastEl"></div>

<script src="/assets/cinema-nav.js"></script>
<script src="/assets/cinema-components.js"></script>
<script>
injectCinemaNav('the-loai');

const GENRES = [
  {
    slug:'kinh-di', name:'Kinh dị', lucideIcon:'ghost',
    dark:'#0d0510', tint:'#7f1d1d', hot:true,
    desc:'Những bộ phim hù dọa, ma quái và tâm lý căng thẳng đến nghẹt thở',
    subGenres:['Ma quái','Tâm lý','J-Horror','Kinh dị Việt','Siêu nhiên'],
    nowCount:6, soonCount:1, pastCount:1,
    posters:[
      'https://cinema.momocdn.net/convert-webp/img/77654494959907436-ddmq.png?size=SM',
      'https://cinema.momocdn.net/convert-webp/img/77653061526174131-mnot.png?size=SM',
      'https://cinema.momocdn.net/convert-webp/img/116033739346174952-lch.png?size=SM',
    ],
  },
  {
    slug:'hanh-dong', name:'Hành động', lucideIcon:'zap',
    dark:'#050e1a', tint:'#1e3a5f', hot:true,
    desc:'Cảnh chiến đấu mãn nhãn, rượt đuổi hồi hộp và anh hùng dũng cảm',
    subGenres:['Siêu anh hùng','Giang hồ','Gián điệp','Quân sự','Sci-fi Action'],
    nowCount:3, soonCount:1, pastCount:2,
    posters:[
      'https://cinema.momocdn.net/convert-webp/img/33968384416504217-spg.png?size=SM',
      'https://cinema.momocdn.net/convert-webp/img/33894194531231265-470wx700h-thief.jpg?size=SM',
      'https://cinema.momocdn.net/convert-webp/img/115606187938743904-conlonyy.png?size=SM',
    ],
  },
  {
    slug:'hoat-hinh', name:'Hoạt hình', lucideIcon:'palette',
    dark:'#0a0520', tint:'#4338ca', hot:true,
    desc:'Phim hoạt hình dành cho mọi lứa tuổi, từ Pixar đến anime Nhật Bản',
    subGenres:['Pixar','Disney','Anime','CGI Châu Á','Gia đình'],
    nowCount:3, soonCount:1, pastCount:2,
    posters:[
      'https://cinema.momocdn.net/convert-webp/img/107954068933179447-postertoystory5.jpg?size=SM',
      'https://cinema.momocdn.net/convert-webp/img/24268527084304697-4dxdoora.png?size=SM',
      'https://cinema.momocdn.net/convert-webp/img/145819503207552036-bachxxa.png?size=SM',
    ],
  },
  {
    slug:'tinh-cam', name:'Tình cảm - Lãng mạn', lucideIcon:'heart',
    dark:'#150510', tint:'#9d174d',
    desc:'Những câu chuyện tình yêu đong đầy cảm xúc, từ học đường đến trưởng thành',
    subGenres:['Học đường','Tình cảm Việt','Cổ trang','K-Drama','Lãng mạn'],
    nowCount:2, soonCount:1, pastCount:2,
    posters:[
      'https://cinema.momocdn.net/convert-webp/img/115947433721927575-mdts.png?size=SM',
      'https://cinema.momocdn.net/convert-webp/img/33894375987018707-350x495-lieutrai.jpg?size=SM',
      'https://cinema.momocdn.net/convert-webp/img/154903641510946968-PosterNguoiDuocChoncompressed.jpg?size=M',
    ],
  },
  {
    slug:'hai', name:'Hài - Hài hước', lucideIcon:'smile',
    dark:'#0f0b00', tint:'#92400e',
    desc:'Tiếng cười sảng khoái sau giờ làm mệt mỏi — hài Việt và hài quốc tế',
    subGenres:['Hài Việt','Hài gia đình','Hài hành động','Stand-up','Romcom'],
    nowCount:1, soonCount:1, pastCount:2,
    posters:[
      'https://cinema.momocdn.net/convert-webp/img/116033739346174952-lch.png?size=SM',
      'https://cinema.momocdn.net/convert-webp/img/22106669547309318-nhsnh.png?size=SM',
      'https://image.tmdb.org/t/p/w500/jlbCaCevS4YHASzW5wVnevbrSy8.jpg',
    ],
  },
  {
    slug:'vien-tuong', name:'Khoa học viễn tưởng', lucideIcon:'rocket',
    dark:'#050514', tint:'#1e1b4b',
    desc:'Khám phá tương lai, vũ trụ và công nghệ chưa từng tồn tại',
    subGenres:['Space Opera','Siêu anh hùng','Dystopia','AI & Robot','Cyberpunk'],
    nowCount:2, soonCount:1, pastCount:2,
    posters:[
      'https://cinema.momocdn.net/convert-webp/img/33968384416504217-spg.png?size=SM',
      'https://cinema.momocdn.net/convert-webp/img/115606187938743904-conlonyy.png?size=SM',
      'https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIe.jpg',
    ],
  },
  {
    slug:'tam-ly', name:'Tâm lý - Bí ẩn', lucideIcon:'eye',
    dark:'#030a04', tint:'#14532d',
    desc:'Twist bất ngờ, câu đố khó đoán và chiều sâu nội tâm nhân vật',
    subGenres:['Trinh thám','Crime Drama','Psychological','Bí ẩn','Thriller'],
    nowCount:2, soonCount:1, pastCount:2,
    posters:[
      'https://cinema.momocdn.net/convert-webp/img/115456074788690542-malu.png?size=SM',
      'https://cinema.momocdn.net/convert-webp/img/154903476143772777-PosterTHAMTUKIEN2compressed.jpg?size=M',
      'https://image.tmdb.org/t/p/w500/7IiTTgloJzvGI1TAYymCfbfl3vT.jpg',
    ],
  },
  {
    slug:'gia-dinh', name:'Gia đình', lucideIcon:'house',
    dark:'#0a0500', tint:'#78350f',
    desc:'Câu chuyện ấm áp về tình thân, phù hợp để xem cùng cả gia đình',
    subGenres:['Gia đình Việt','Hoạt hình gia đình','Bố mẹ & con','Cuối tuần','Hài gia đình'],
    nowCount:2, soonCount:1, pastCount:2,
    posters:[
      'https://cinema.momocdn.net/convert-webp/img/107954068933179447-postertoystory5.jpg?size=SM',
      'https://cinema.momocdn.net/convert-webp/img/24268527084304697-4dxdoora.png?size=SM',
      'https://cinema.momocdn.net/convert-webp/img/22106669547309318-nhsnh.png?size=SM',
    ],
  },
];

let sortMode = 'hot';

function sortedGenres(){
  if(sortMode === 'az') return [...GENRES].sort((a,b)=>a.name.localeCompare(b.name,'vi'));
  if(sortMode === 'count') return [...GENRES].sort((a,b)=>(b.nowCount+b.soonCount)-(a.nowCount+a.soonCount));
  return [...GENRES].sort((a,b)=>{
    if(a.hot && !b.hot) return -1;
    if(!a.hot && b.hot) return 1;
    return b.nowCount - a.nowCount;
  });
}

function setSort(mode, el){
  sortMode = mode;
  document.querySelectorAll('.spill').forEach(p=>p.classList.remove('on'));
  el.classList.add('on');
  renderGrid();
}

function renderFeatured(){
  const hot = GENRES.filter(g=>g.hot).slice(0,3);
  document.getElementById('featuredRow').innerHTML = hot.map(g=>`
    <div class="feat-card" onclick="window.location.href='/cinema/genres/${g.slug}'">
      <div class="feat-bg" style="background-image:url('${g.posters[0]}')"></div>
      <div class="feat-color-tint" style="background:${g.tint}"></div>
      <div class="feat-overlay"></div>
      <div class="feat-body">
        <div style="display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.15);backdrop-filter:blur(4px);margin-bottom:10px"><i data-lucide="${g.lucideIcon}" width="22" height="22" stroke-width="2" style="color:#fff"></i></div>
        <div class="feat-name">${g.name}</div>
        <div class="feat-count">${g.nowCount} đang chiếu · ${g.soonCount} sắp chiếu</div>
        <div class="feat-tags">${g.subGenres.slice(0,3).map(s=>`<span class="feat-tag">${s}</span>`).join('')}</div>
        <button class="feat-cta" onclick="event.stopPropagation();window.location.href='/cinema/genres/${g.slug}'">Khám phá<i data-lucide="arrow-right" width="13" height="13" stroke-width="2.5" style="display:inline-block;vertical-align:middle;margin-left:4px"></i></button>
      </div>
    </div>`).join('');
}

function renderGrid(){
  const genres = sortedGenres();
  document.getElementById('ctrlCount').textContent = `${genres.length} thể loại`;
  document.getElementById('genreGrid').innerHTML = genres.map(g=>{
    const totalFilms = g.nowCount + g.soonCount + g.pastCount;
    return `<div class="genre-card" onclick="window.location.href='/cinema/genres/${g.slug}'" style="--gc-dark:${g.dark}">
      <div class="gc-poster-strip">
        <img src="${g.posters[0]}" loading="lazy" onerror="this.style.display='none'">
        <div class="gc-fade"></div>
        ${g.hot?`<span class="gc-hot-badge"><i data-lucide="flame" width="10" height="10" stroke-width="2.5"></i>Đang hot</span>`:''}
      </div>
      <div class="gc-body">
        <div class="gc-name">${g.name}</div>
        <div class="gc-count">${totalFilms} phim</div>
      </div>
    </div>`;
  }).join('');
  lucide.createIcons();
}

renderFeatured();
renderGrid();
</script>
</body>
</html>
