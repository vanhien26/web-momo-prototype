<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MoMo Prototype Home</title>
  <meta name="description" content="Homepage điều hướng prototype cho đội Dev: chọn MoSpark Platform, Mini Web Overview, Utilities Tool hoặc PLG Project.">
  <link rel="shortcut icon" type="image/svg+xml" href="https://homepage.momocdn.net/fileuploads/svg/momo-file-240411162904.svg">
  <link rel="stylesheet" href="assets/store.css?v=36">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tippy.js@6/dist/tippy.css">
</head>
<body>
  <div class="app-shell">

    <!-- ── Sidebar ───────────────────────────────────────── -->
    <aside class="proto-sidebar" id="protoSidebar">
      <div class="sidebar-top">
        <a class="brand" href="index.html">
          <span class="brand-mark"><img src="https://homepage.momocdn.net/fileuploads/svg/momo-file-240411162904.svg" alt="MoMo" style="width:80%;height:80%;object-fit:contain;display:block"></span>
          <span class="brand-mark" style="background:#fff;border:1px solid rgba(0,0,0,.08)"><img src="assets/images/logo-web-platform.svg" alt="Web Platform" style="width:80%;height:80%;object-fit:contain;display:block"></span>
          <span class="brand-label">
            <strong>Web Platform</strong>
          </span>
        </a>
        <button id="sidebarCollapseBtn" class="sidebar-collapse-btn" title="Ẩn sidebar" aria-label="Ẩn sidebar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
      </div>

      <p class="nav-section-label">Project groups</p>
      <nav id="protoNav" class="proto-nav"></nav>

      <div class="sidebar-footer-block">
        <span><i></i>Live preview</span>
        <p>Research-spec · Web Platform · 13/06/2026</p>
      </div>
    </aside>

    <!-- ── Workspace ─────────────────────────────────────── -->
    <div class="proto-workspace" id="protoWorkspace">
      <!-- rendered by store.js -->
    </div>

  </div>

  <!-- Mobile overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <!-- Mobile menu button (injected by JS on small screens) -->
  <!-- Desktop sidebar reveal tab -->
  <button id="sidebarRevealBtn" class="sidebar-reveal-btn" title="Hiện sidebar" aria-label="Hiện sidebar">
    <svg width="12" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </button>

  <script src="assets/mini-web-data.js?v=1"></script>
  <script src="assets/mini-web-volume.js?v=1"></script>
  <script src="assets/store.js?v=135"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/countup.js/2.8.0/countUp.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/motion@11.18.2/dist/motion.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tippy.js@6/dist/tippy.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
  // Runs after store.js DOMContentLoaded (registered first) has rendered the workspace
  document.addEventListener('DOMContentLoaded', function() {

    // ── Tier 1: CountUp ─────────────────────────────────────────────────────
    var CU = window.countUp && window.countUp.CountUp;
    if (CU) {
      document.querySelectorAll('.lab-chip b').forEach(function(el) {
        var end = parseInt(el.textContent, 10);
        if (isNaN(end)) return;
        el.textContent = '0';
        new CU(el, end, { duration: 1.4, useEasing: true }).start();
      });
      document.querySelectorAll('.lab-section-cnt').forEach(function(el) {
        var end = parseInt(el.textContent, 10);
        if (isNaN(end)) return;
        el.textContent = '0';
        new CU(el, end, { duration: 1.1, useEasing: true, delay: 0.3 }).start();
      });
    }

    // ── Tier 1: Motion One scroll reveal ────────────────────────────────────
    if (window.Motion) {
      var _anim = window.Motion.animate, _inView = window.Motion.inView;
      document.querySelectorAll('.lab-section').forEach(function(el) {
        el.style.opacity = '0';
        el.style.transform = 'translateY(18px)';
      });
      _inView('.lab-section', function(entry) {
        _anim(entry.target,
          { opacity: 1, transform: 'translateY(0px)' },
          { duration: 0.5, easing: [0.22, 1, 0.36, 1] }
        );
      }, { margin: '-6% 0px' });
    }

    // ── Tier 1: Tippy sidebar nav tooltips ──────────────────────────────────
    if (typeof tippy !== 'undefined' && typeof tippy.delegate === 'function') {
      tippy.delegate('#protoNav', {
        target: '[data-id]',
        content: function(ref) {
          var proto = PROTOTYPES.find(function(p) { return p.id === ref.dataset.id; });
          return (proto && proto.description) ? proto.description : '';
        },
        placement: 'right',
        delay: [450, 0],
        theme: 'lab-dark',
        maxWidth: 230,
        onShow: function(instance) {
          return !!instance.props.content(instance.reference);
        },
      });
    }

    // ── GSAP Hero Entrance ───────────────────────────────────────────────────
    if (typeof gsap === 'undefined') return;
    var hero = document.querySelector('.lab-hero');
    if (!hero) return;

    gsap.set('.lab-star',        { opacity: 0 });
    gsap.set('.lab-kicker',      { opacity: 0, y: -10 });
    gsap.set('.lab-title-word',  { opacity: 0, y: 22 });
    gsap.set('.lab-title-accent',{ opacity: 0, y: 22 });
    gsap.set('.lab-title-sub',   { opacity: 0, y: 14 });
    gsap.set('.lab-sub',         { opacity: 0, y: 12 });
    gsap.set('.lab-hero-search', { opacity: 0, y: 8 });

    gsap.timeline({ defaults: { ease: 'power3.out' } })
      .to('.lab-star',         { opacity: 1, duration: 1.8, stagger: 0.06 }, 0)
      .to('.lab-kicker',       { opacity: 1, y: 0, duration: 0.55 }, 0.08)
      .to('.lab-title-word',   { opacity: 1, y: 0, duration: 0.65 }, 0.26)
      .to('.lab-title-accent', { opacity: 1, y: 0, duration: 0.65 }, 0.40)
      .to('.lab-title-sub',    { opacity: 1, y: 0, duration: 0.60 }, 0.55)
      .to('.lab-sub',          { opacity: 1, y: 0, duration: 0.55 }, 0.70)
      .to('.lab-hero-search',  { opacity: 1, y: 0, duration: 0.50 }, 0.84);
  });
  </script>
</body>
</html>
